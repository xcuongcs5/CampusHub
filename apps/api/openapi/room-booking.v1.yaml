openapi: 3.1.0
info:
  title: Campus Hub Room Booking API
  version: 1.0.0-draft
  description: >-
    REST transport contract for the Room Booking MVP. Domain rules are defined in
    docs/room-booking-domain.md and application semantics in
    docs/room-booking-application-contract.md.
servers:
  - url: /api/v1
    description: Current host
security:
  - bearerAuth: []
tags:
  - name: Availability
  - name: My room bookings
  - name: Room booking operations

paths:
  /rooms/availability:
    get:
      tags: [Availability]
      operationId: searchAvailableRooms
      summary: Search rooms available for a time range
      parameters:
        - name: campus_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: starts_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: ends_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: attendee_count
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: required_features
          in: query
          required: false
          description: Repeated query parameter containing opaque feature codes.
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
          style: form
          explode: true
      responses:
        '200':
          description: Rooms matching the criteria at the observed time.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /room-bookings:
    post:
      tags: [My room bookings]
      operationId: requestRoomBooking
      summary: Request a room booking
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestRoomBookingRequest'
      responses:
        '201':
          description: >-
            Booking created as CONFIRMED for a free room or PENDING_PAYMENT for a
            paid room.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
              description: Relative URL of the created booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomBookingDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /room-bookings/{booking_id}:
    get:
      tags: [My room bookings]
      operationId: getRoomBooking
      summary: Get a room booking visible to the current actor
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current booking state.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomBookingDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/room-bookings:
    get:
      tags: [My room bookings]
      operationId: listMyRoomBookings
      summary: List room bookings of the current student
      parameters:
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum: [UPCOMING, HISTORY]
            default: UPCOMING
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RoomBookingStatus'
            uniqueItems: true
          style: form
          explode: true
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Cursor-paginated bookings owned by the current actor.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomBookingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /room-bookings/{booking_id}/cancellation:
    post:
      tags: [My room bookings]
      operationId: cancelRoomBooking
      summary: Cancel a booking owned by the current student
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRoomBookingRequest'
      responses:
        '200':
          description: Booking cancelled and refund requirement calculated.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /room-bookings/{booking_id}/check-in:
    post:
      tags: [My room bookings]
      operationId: checkInRoomBooking
      summary: Check in to a confirmed booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRoomBookingRequest'
      responses:
        '200':
          description: Booking checked in.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomBookingDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/room-bookings:
    get:
      tags: [Room booking operations]
      operationId: listOperationalRoomBookings
      summary: List bookings in the staff member's campus scope
      parameters:
        - name: campus_id
          in: query
          required: true
          schema:
            type: string
        - name: starts_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: ends_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: room_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RoomBookingStatus'
            uniqueItems: true
          style: form
          explode: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Cursor-paginated operational booking list.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalRoomBookingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/room-bookings/{booking_id}/staff-check-in:
    post:
      tags: [Room booking operations]
      operationId: staffCheckInRoomBooking
      summary: Check in a booking as an authorized staff exception
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCheckInRequest'
      responses:
        '200':
          description: Booking checked in by staff.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomBookingDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/room-bookings/{booking_id}/revocation:
    post:
      tags: [Room booking operations]
      operationId: revokeRoomBooking
      summary: Revoke a booking for an operational reason
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRoomBookingRequest'
      responses:
        '200':
          description: Booking revoked; refund requirement is included when applicable.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookingId:
      name: booking_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique opaque key retained when retrying the same intent.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1

  headers:
    CorrelationId:
      description: Correlation identifier used across synchronous and asynchronous work.
      schema:
        type: string
    ETag:
      description: Opaque representation version of the booking.
      schema:
        type: string

  responses:
    BadRequest:
      description: Request syntax or basic shape is invalid.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The actor does not have permission in the requested scope.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The resource does not exist or is not visible to the actor.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Current availability, state, version, or operation key conflicts.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BusinessRuleViolation:
      description: The request is syntactically valid but violates a business policy.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: Too many requests.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the actor should retry, when known.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DependencyUnavailable:
      description: A required dependency is temporarily unavailable.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: VND

    RoomSummary:
      type: object
      additionalProperties: false
      required: [room_id, display_name, campus_id, campus_name, capacity, features]
      properties:
        room_id:
          type: string
        display_name:
          type: string
        campus_id:
          type: string
        campus_name:
          type: string
        capacity:
          type: integer
          minimum: 1
        features:
          type: array
          items:
            type: string
          uniqueItems: true

    AvailableRoom:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/RoomSummary'
        - type: object
          required: [availability_observed_at, estimated_price, policy_summary]
          properties:
            availability_observed_at:
              type: string
              format: date-time
            estimated_price:
              $ref: '#/components/schemas/Money'
            policy_summary:
              $ref: '#/components/schemas/BookingPolicySummary'

    AvailabilitySearchResult:
      type: object
      additionalProperties: false
      required: [items, observed_at]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AvailableRoom'
        observed_at:
          type: string
          format: date-time

    BookingPolicySummary:
      type: object
      additionalProperties: false
      required:
        - max_duration_minutes
        - cancellation_full_refund_before_minutes
        - check_in_opens_before_minutes
        - check_in_closes_after_minutes
      properties:
        max_duration_minutes:
          type: integer
          minimum: 1
        cancellation_full_refund_before_minutes:
          type: integer
          minimum: 0
        check_in_opens_before_minutes:
          type: integer
          minimum: 0
        check_in_closes_after_minutes:
          type: integer
          minimum: 0

    RoomBookingStatus:
      type: string
      enum:
        - PENDING_PAYMENT
        - CONFIRMED
        - CHECKED_IN
        - COMPLETED
        - EXPIRED
        - CANCELLED
        - NO_SHOW
        - REVOKED

    PaymentSummary:
      type: object
      additionalProperties: false
      required: [required, amount, status]
      properties:
        required:
          type: boolean
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [NOT_REQUIRED, PENDING, SUCCEEDED, FAILED, REFUND_PENDING, REFUNDED, REFUND_FAILED]

    PaymentAction:
      type: object
      additionalProperties: false
      required: [action_type, action_url, expires_at]
      properties:
        action_type:
          type: string
          enum: [REDIRECT, DEEP_LINK]
        action_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    CheckInWindow:
      type: object
      additionalProperties: false
      required: [opens_at, closes_at]
      properties:
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time

    RoomBookingSummary:
      type: object
      additionalProperties: false
      required:
        - booking_id
        - room
        - starts_at
        - ends_at
        - attendee_count
        - status
        - price
        - version
      properties:
        booking_id:
          type: string
        room:
          $ref: '#/components/schemas/RoomSummary'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        attendee_count:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RoomBookingStatus'
        price:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          minimum: 1

    RoomBookingDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/RoomBookingSummary'
        - type: object
          required:
            - purpose
            - payment
            - available_actions
            - created_at
            - updated_at
          properties:
            purpose:
              type: string
            payment:
              $ref: '#/components/schemas/PaymentSummary'
            hold_expires_at:
              type: string
              format: date-time
            payment_action:
              $ref: '#/components/schemas/PaymentAction'
            check_in_window:
              $ref: '#/components/schemas/CheckInWindow'
            available_actions:
              type: array
              items:
                type: string
                enum: [CANCEL, CHECK_IN]
              uniqueItems: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    RequestRoomBookingRequest:
      type: object
      additionalProperties: false
      required: [room_id, starts_at, ends_at, attendee_count, purpose]
      properties:
        room_id:
          type: string
          minLength: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        attendee_count:
          type: integer
          minimum: 1
        purpose:
          type: string
          minLength: 1
          maxLength: 500

    RoomBookingPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomBookingSummary'
        next_cursor:
          type: string

    CancelRoomBookingRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500

    CancellationOutcome:
      type: object
      additionalProperties: false
      required: [refundable, refund_amount, policy_explanation]
      properties:
        refundable:
          type: boolean
        refund_amount:
          $ref: '#/components/schemas/Money'
        policy_explanation:
          type: string

    CancellationResult:
      type: object
      additionalProperties: false
      required: [booking, cancellation_outcome]
      properties:
        booking:
          $ref: '#/components/schemas/RoomBookingDetail'
        cancellation_outcome:
          $ref: '#/components/schemas/CancellationOutcome'

    CheckInRoomBookingRequest:
      type: object
      additionalProperties: false
      required: [room_check_in_token]
      properties:
        room_check_in_token:
          type: string
          minLength: 16
          maxLength: 2048

    StaffCheckInRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    RevokeRoomBookingRequest:
      type: object
      additionalProperties: false
      required: [reason_code, reason_detail]
      properties:
        reason_code:
          type: string
          enum: [OFFICIAL_SCHEDULE_CONFLICT, MAINTENANCE, SAFETY, EMERGENCY, OTHER]
        reason_detail:
          type: string
          minLength: 1
          maxLength: 1000

    RevocationResult:
      type: object
      additionalProperties: false
      required: [booking, refund_required, refund_amount]
      properties:
        booking:
          $ref: '#/components/schemas/RoomBookingDetail'
        refund_required:
          type: boolean
        refund_amount:
          $ref: '#/components/schemas/Money'

    OperationalRoomBooking:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/RoomBookingSummary'
        - type: object
          required: [booker_display_name, booker_contact, purpose]
          properties:
            booker_display_name:
              type: string
            booker_contact:
              type: string
              description: Minimum contact information allowed for this staff scope.
            purpose:
              type: string

    OperationalRoomBookingPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationalRoomBooking'
        next_cursor:
          type: string

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlation_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        correlation_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

